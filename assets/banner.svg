<svg xmlns="http://www.w3.org/2000/svg" width="720" height="120" viewBox="0 0 720 120" role="img" aria-label="terminal banner">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF2E97"/>
    </linearGradient>
  </defs>

  <!-- terminal window body -->
  <rect x="2" y="2" width="716" height="116" rx="10" fill="#0D1117" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>

  <!-- title bar -->
  <line x1="2" y1="28" x2="718" y2="28" stroke="url(#neon)" stroke-width="1" opacity="0.6"/>
  <circle cx="20" cy="15" r="5" fill="#FF5F56"/>
  <circle cx="38" cy="15" r="5" fill="#FFBD2E"/>
  <circle cx="56" cy="15" r="5" fill="#27C93F"/>
  <text x="360" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#8B949E">visitor@chu0119: ~/profile — zsh</text>

  <!-- prompt + typing animation -->
  <text x="20" y="60" font-family="monospace" font-size="20" fill="#00E5FF" filter="url(#glow)">
    <tspan fill="#FF2E97">➜</tspan>  <tspan fill="#00E5FF">~/</tspan> <tspan fill="#C9D1D9">whoami</tspan>
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </text>

  <!-- output line -->
  <text x="20" y="95" font-family="monospace" font-size="22" font-weight="bold" fill="url(#neon)" filter="url(#glow)">xingchuan · Security Researcher</text>

  <!-- cursor -->
  <rect x="530" y="78" width="12" height="22" fill="#00E5FF">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
