name: Update Activity

on:
  schedule:
    - cron: '17 0 * * *'  # daily 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest defusedxml

      - name: Validate activity updater
        run: python -m pytest tests/test_update_activity.py tests/test_profile_content.py -q

      - name: Fetch recent activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_activity.py

      - name: Validate updated profile
        run: python -m pytest tests/test_profile_content.py -q

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update recent activity" && git push)
