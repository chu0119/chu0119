name: Generate Profile Stats

on:
  schedule:
    - cron: '7 0 * * *'  # daily 00:07 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/generate_stats.py']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet assets/ || (git add assets/ && git commit -m "chore: update profile stats" && git push)
